name: deploy dashboard

# Deploys /docs when YOU push changes (bot pushes made with GITHUB_TOKEN don't trigger
# workflows, so trade.yml / weekly.yml deploy for themselves).
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stamp PWA build id (versioned service worker -> auto-update)
        run: echo "build=$(bash scripts/stamp_build.sh)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
