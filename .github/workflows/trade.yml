name: paper-trade cycle

# Snapshot Kalshi public data every ~6-7 hours (cron every 6h + random 0-45 min jitter),
# simulate fills, settle, mark to market, commit state + dashboard data, redeploy Pages.
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"   # UTC
  workflow_dispatch:
    inputs:
      no_jitter:
        description: "Skip the random start delay"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kal-grok-state
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Jitter (6-7h spacing)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 2700 ))
      - name: Unit tests (offline)
        run: KALGROK_OFFLINE=1 python -m pytest -q
      - name: Run one paper-trading cycle
        run: python -m kalbot.run
      - name: Commit state and dashboard data
        run: |
          git config user.name "kal-grok-bot"
          git config user.email "kal-grok-bot@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "paper cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1

  deploy:
    needs: cycle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
