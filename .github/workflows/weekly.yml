name: weekly re-evaluation

# Sundays 14:41 UTC (9:41 AM ET in winter): score strategies, reallocate capital,
# tune parameters, write the weekly report, redeploy the dashboard.
on:
  schedule:
    - cron: "41 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kal-grok-state
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weekly evaluation
        run: python -m kalbot.evaluate
      - name: Commit report and new allocation
        run: |
          git config user.name "kal-grok-bot"
          git config user.email "kal-grok-bot@users.noreply.github.com"
          git add state docs/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "weekly review $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 5))
          done
          exit 1

  deploy:
    needs: evaluate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
